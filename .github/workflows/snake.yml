name: Generate contribution garden snake

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23d9983d&color_dots=%23edf5ef,%23b9ddc1,%237ab88a,%233d8051,%23245238
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23f0b55a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
